<style>
/* Layout: mail-client split — message list on the left, reading pane on the right; stacks on phones */
:root {
  --bg: #f3f5f7;
  --panel: #ffffff;
  --ink: #17212b;
  --muted: #5d6b78;
  --line: #dde3e9;
  --hover: #eef2f5;
  --accent: #0f6e7a;
  --accent-soft: #e0f0f2;
  --ham: #1e7a44; --ham-bg: #e3f3e9;
  --spam: #9a6200; --spam-bg: #fbf0da;
  --phish: #b3261e; --phish-bg: #fbe5e3;
  --code-bg: #f6f8fa;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1418; --panel: #161d23; --ink: #e4e9ee; --muted: #93a1ae; --line: #26313a; --hover: #1d262d;
    --accent: #4fb8c4; --accent-soft: #15333a;
    --ham: #6fd39a; --ham-bg: #173226; --spam: #f0b54a; --spam-bg: #362a12; --phish: #ff8a80; --phish-bg: #3d1a18;
    --code-bg: #11181d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1418; --panel: #161d23; --ink: #e4e9ee; --muted: #93a1ae; --line: #26313a; --hover: #1d262d;
  --accent: #4fb8c4; --accent-soft: #15333a;
  --ham: #6fd39a; --ham-bg: #173226; --spam: #f0b54a; --spam-bg: #362a12; --phish: #ff8a80; --phish-bg: #3d1a18;
  --code-bg: #11181d; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 40px; display: grid; gap: 16px; }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { margin: 0; font-size: 1.5rem; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
.sub { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
.sub code { font-family: var(--f-mono); font-size: 0.85em; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; }
.stat { display: flex; align-items: baseline; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: 0.85rem; color: var(--muted); }
.stat b { font-variant-numeric: tabular-nums; color: var(--ink); font-size: 1rem; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; align-self: center; }
.dot.ham { background: var(--ham); } .dot.spam { background: var(--spam); } .dot.phishing { background: var(--phish); }

.client { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; min-height: 640px; }
.listcol { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
.tools { padding: 12px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.search { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; font-size: 0.9rem; }
.search:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { font: inherit; font-size: 0.8rem; font-weight: 500; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.filters button:hover { background: var(--hover); }
.filters button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--ink); }
.filters .n { font-variant-numeric: tabular-nums; opacity: .75; }

.list { list-style: none; margin: 0; padding: 0; overflow-y: auto; max-height: 720px; }
.item { display: grid; grid-template-columns: 4px minmax(0, 1fr); border-bottom: 1px solid var(--line); cursor: pointer; }
.item:hover { background: var(--hover); }
.item.sel { background: var(--accent-soft); }
.item .stripe.ham { background: var(--ham); } .item .stripe.spam { background: var(--spam); } .item .stripe.phishing { background: var(--phish); }
.item .body { padding: 10px 12px; min-width: 0; display: grid; gap: 2px; }
.row1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.from { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.num { font-family: var(--f-mono); font-size: 0.72rem; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.subj { font-size: 0.87rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snip { font-size: 0.8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.warnmark { color: var(--phish); font-size: 0.72rem; font-weight: 600; }
.empty { padding: 24px 16px; color: var(--muted); font-size: 0.9rem; }

.reader { padding: 24px 28px; min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.back { display: none; font: inherit; font-size: 0.85rem; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; align-self: start; }
.rhead { display: grid; gap: 10px; }
.rhead h2 { margin: 0; font-size: 1.3rem; line-height: 1.3; text-wrap: balance; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; justify-self: start; }
.pill.ham { color: var(--ham); background: var(--ham-bg); }
.pill.spam { color: var(--spam); background: var(--spam-bg); }
.pill.phishing { color: var(--phish); background: var(--phish-bg); }
.sender { display: flex; gap: 12px; align-items: center; }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--hover); color: var(--accent); flex: none; }
.sender .who { min-width: 0; }
.sender .name { font-weight: 600; }
.sender .addr { font-family: var(--f-mono); font-size: 0.8rem; color: var(--muted); overflow-wrap: anywhere; }
.headers { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 0.82rem; padding: 12px 14px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; }
.headers dt { color: var(--muted); font-family: var(--f-mono); font-size: 0.76rem; padding-top: 1px; }
.headers dd { margin: 0; font-family: var(--f-mono); overflow-wrap: anywhere; }
.headers .none { color: var(--muted); }
.headers .bad { color: var(--phish); font-weight: 500; }
.alerts { display: grid; gap: 6px; }
.alert { font-size: 0.85rem; padding: 8px 12px; border-radius: 6px; background: var(--phish-bg); color: var(--ink); border-left: 3px solid var(--phish); }
.alert code { font-family: var(--f-mono); font-size: 0.8rem; }
.msg { font-size: 1rem; line-height: 1.65; max-width: 65ch; margin: 0; overflow-wrap: anywhere; }
.msg .url { font-family: var(--f-mono); font-size: 0.85em; color: var(--accent); background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
.msg .url.http { color: var(--phish); background: var(--phish-bg); }
.note { font-size: 0.78rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; }

@media (max-width: 760px) {
  .client { grid-template-columns: minmax(0, 1fr); min-height: 0; }
  .listcol { border-right: 0; }
  .list { max-height: none; }
  .reader { padding: 18px 16px; }
  .client.reading .listcol { display: none; }
  .client:not(.reading) .reader { display: none; }
  .back { display: inline-block; }
}
</style>

const LABELS = { ham: "Légitime", spam: "Pourriel", phishing: "Hameçonnage" };
const ORDER = ["all", "ham", "spam", "phishing"];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dom = a => (a || "").split("@").pop().toLowerCase();

EMAILS.forEach((e, i) => {
  e.id = i + 1;
  e.alerts = [];
  const sd = dom(e.sender);
  if (e.return_path && dom(e.return_path) !== sd) e.alerts.push(["Return-Path", dom(e.return_path), sd]);
  if (e.reply_to && dom(e.reply_to) !== sd) e.alerts.push(["Reply-To", dom(e.reply_to), sd]);
});

let filter = "all", query = "", selected = EMAILS.find(e => e.label === "phishing" && e.alerts.length)?.id || 1;

const counts = EMAILS.reduce((m, e) => (m[e.label] = (m[e.label] || 0) + 1, m), {});
$("#total").textContent = EMAILS.length;
$("#stats").innerHTML = ["ham", "spam", "phishing"].map(l =>
  `<span class="stat"><span class="dot ${l}"></span>${LABELS[l]} <b>${counts[l] || 0}</b></span>`).join("");

function renderFilters() {
  $("#filters").innerHTML = ORDER.map(l => {
    const n = l === "all" ? EMAILS.length : (counts[l] || 0);
    const dot = l === "all" ? "" : `<span class="dot ${l}"></span>`;
    return `<button type="button" data-f="${l}" aria-pressed="${filter === l}">${dot}${l === "all" ? "Tous" : LABELS[l]} <span class="n">${n}</span></button>`;
  }).join("");
}

function visible() {
  const q = query.trim().toLowerCase();
  return EMAILS.filter(e => (filter === "all" || e.label === filter) &&
    (!q || [e.name, e.sender, e.subject, e.message].join(" ").toLowerCase().includes(q)));
}

function renderList() {
  const items = visible();
  $("#list").innerHTML = items.length ? items.map(e => `
    <li class="item${e.id === selected ? " sel" : ""}" data-id="${e.id}" tabindex="0">
      <span class="stripe ${e.label}"></span>
      <div class="body">

    </li>`).join("") : `<li class="empty">Aucun courriel ne correspond à cette recherche.</li>`;
}

function linkify(text) {
  return esc(text).replace(/(https?:\/\/[^\s]+?)([.,)]?)(?=\s|$)/g, (m, url, tail) =>
    `<span class="url ${url.startsWith("http:") ? "http" : ""}" title="${url.startsWith("http:") ? "Lien non chiffré (http)" : "Lien"}">${url}</span>${tail}`);
}

function renderReader() {
  const e = EMAILS.find(x => x.id === selected);
  if (!e) { $("#reader").innerHTML = `<p class="empty">Sélectionnez un courriel.</p>`; return; }
  const badHdr = h => e.alerts.some(a => a[0] === h);
  const hv = (h, v) => v ? `<dd class="${badHdr(h) ? "bad" : ""}">${esc(v)}</dd>` : `<dd class="none">—</dd>`;
  $("#reader").innerHTML = `
    <button class="back" type="button" id="back">← Retour à la liste</button>
    <div class="rhead">
      <span class="pill ${e.label}"><span class="dot ${e.label}"></span>${LABELS[e.label]} · ${e.label}</span>
      <h2>${esc(e.subject)}</h2>
      <div class="sender">
        <span class="avatar" aria-hidden="true">${esc(e.name.trim()[0] || "?")}</span>
        <div class="who"><div class="name">${esc(e.name)}</div><div class="addr">&lt;${esc(e.sender)}&gt;</div></div>
      </div>
    </div>
    <dl class="headers">
      <dt>From</dt><dd>${esc(e.name)} &lt;${esc(e.sender)}&gt;</dd>
      <dt>Subject</dt><dd>${esc(e.subject)}</dd>
      <dt>Return-Path</dt>${hv("Return-Path", e.return_path)}
      <dt>Reply-To</dt>${hv("Reply-To", e.reply_to)}
    </dl>
    ${e.alerts.length ? `<div class="alerts">${e.alerts.map(([h, d, s]) =>
      `<div class="alert"><strong>${h}</strong> pointe vers <code>${esc(d)}</code>, alors que l'expéditeur est sur <code>${esc(s)}</code>.</div>`).join("")}</div>` : ""}
    <p class="msg">${linkify(e.message)}</p>
    <div class="note">Courriel #${e.id} sur ${EMAILS.length} · étiquette attendue dans le jeu de test : <code>${e.label}</code></div>`;
  $("#back").onclick = () => { $("#client").classList.remove("reading"); };
}

function render() { renderFilters(); renderList(); renderReader(); }

$("#filters").addEventListener("click", ev => {
  const b = ev.target.closest("button[data-f]"); if (!b) return;
  filter = b.dataset.f;
  const v = visible(); if (v.length && !v.some(e => e.id === selected)) selected = v[0].id;
  render();
});
$("#q").addEventListener("input", ev => { query = ev.target.value; renderList(); });
function pick(li) { if (!li) return; selected = +li.dataset.id; renderList(); renderReader(); $("#client").classList.add("reading"); }
$("#list").addEventListener("click", ev => pick(ev.target.closest(".item")));
$("#list").addEventListener("keydown", ev => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); pick(ev.target.closest(".item")); } });

render();
</script>
